name: Update blog posts

# Copies the newest Wix blog posts into blog.json a few times a day, then asks GitHub Pages to republish.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch posts
        run: python scripts/update_blog.py
      - name: Commit and republish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- blog.json blog)" ]; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "blog-sync"
          git config user.email "blog-sync@users.noreply.github.com"
          git add blog.json blog
          git commit -m "Update blog posts from Wix"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
