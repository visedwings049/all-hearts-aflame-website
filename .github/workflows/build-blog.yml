name: Build blog

# Runs when a post is saved in the Tina editor (or changed any other way) and rebuilds the blog pages.
on:
  push:
    paths:
      - "content/posts/**"
      - "scripts/build_blog.py"
      - "scripts/blogpost.html"
      - "scripts/blogindex.html"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pyyaml
      - run: python scripts/build_blog.py
      - name: Commit and republish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- blog blog.json)" ]; then
            echo "Nothing to publish."
            exit 0
          fi
          git config user.name "blog-build"
          git config user.email "blog-build@users.noreply.github.com"
          git add blog blog.json
          git commit -m "Build blog pages"
          git pull --rebase origin main
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
